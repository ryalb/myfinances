name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myfinances
          POSTGRES_USER: myfinances
          POSTGRES_PASSWORD: myfinances
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myfinances -d myfinances"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: myfinances
      POSTGRES_USER: myfinances
      POSTGRES_PASSWORD: myfinances
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_DEBUG: "False"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install toolchain versions
        run: mise install

      - name: Prepare environment files
        run: cp backend/.env.example backend/.env

      - name: Install project dependencies
        run: mise run setup

      - name: Run repository checks
        run: mise run check

      - name: Build frontend
        run: mise run frontend-build

      - name: Run prek hooks
        run: uv tool run prek run --all-files
