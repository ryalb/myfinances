[project]
name = "myfinances-backend"
version = "0.1.0"
description = "MyFinances backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery>=5.4,<6.0",
  "django-cors-headers>=4.4,<5.0",
  "Django>=5.1,<6.0",
  "djangorestframework-simplejwt>=5.3,<6.0",
  "djangorestframework>=3.15,<4.0",
  "graphene-django>=3.2,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.0,<6.0",
  "requests>=2.32,<3.0",
]

[dependency-groups]
dev = [
  "prek>=0.4,<0.5",
  "ruff>=0.6,<0.7",
  "ty>=0.0.1a8,<0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
