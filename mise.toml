[tools]
python = "3.12"
uv = "0.8.8"
bun = "1.3.5"
node = "22"

[env]
PYTHONPATH = "backend"

[tasks.setup]
description = "Install backend and frontend dependencies"
run = [
  "cd backend && docker compose up -d --force-recreate --remove-orphans",
  "cd backend && uv sync --group dev",
  "cd frontend && bun install",
]

[tasks.backend-dev]
description = "Run Django API via Daphne (ASGI/WebSocket)"
# `ngrok` NAO pode entrar aqui: `depends` espera a task terminar, e
# `ngrok start --all` nunca termina -- o daphne nunca subiria.
# Rode o tunel em paralelo: `mise run backend-dev ::: ngrok`
depends = ["backend-migrate", "kill-port 8000"]
run = "cd backend && uv run daphne config.asgi:application --port 8000"
# output = "interleave"
env = { FORCE_COLOR = "1", RichTraceback_color_system = "true" }

[tasks.backend-migrate]
description = "Run Django migrations"
run = "cd backend && uv run python manage.py migrate"

[tasks.backend-worker]
description = "Run Celery worker"
run = "cd backend && uv run celery -A config worker -l info"

[tasks.backend-lint]
description = "Run Ruff checks"
run = "cd backend && uv run ruff check . --fix"

[tasks.backend-format]
description = "Run Ruff formatter"
run = "cd backend && uv run ruff format ."

[tasks.backend-typecheck]
description = "Run ty type checker"
run = "cd backend && uv run ty check . --ignore unresolved-attribute --ignore unknown-argument --ignore invalid-return-type"

[tasks.backend-test]
description = "Run backend tests"
run = "cd backend && uv run pytest"

[tasks.frontend-dev]
depends = ["kill-port 3000"]
description = "Run Nuxt dev server"
run = "cd frontend && bun run dev"
output = "interleave"

[tasks.frontend-build]
description = "Build frontend"
run = "cd frontend && bun run build"

[tasks.frontend-lint]
description = "Run ESLint"
run = "cd frontend && bun run lint"

[tasks.frontend-lint-fix]
description = "Run ESLint with fixes"
run = "cd frontend && bun run lint:fix"

[tasks.ngrok]
description = "Start ngrok with all configured tunnels"
run = "ngrok start --all"

[tasks.kill-port]
description = "Kill all processes on a given port"
run = "sh -c 'lsof -ti :$1 | xargs kill -9 2>/dev/null || true' dummy $1"

[tasks.db-backup]
description = "Dump the Postgres database to tmp/backups/ (custom format, restorable)"
run = "sh scripts/db-backup.sh"

[tasks.db-backups]
description = "List available database backups (newest first)"
run = "sh -c 'ls -lht tmp/backups/*.dump 2>/dev/null || echo \"Nenhum backup em tmp/backups/. Rode: mise run db-backup\"'"

[tasks.db-restore]
description = "Restore the database from a dump. Usage: mise run db-restore <arquivo.dump>"
run = "sh scripts/db-restore.sh $1"

[tasks.db-reset]
description = "DROP and recreate the database, then run migrations from scratch"
run = "sh scripts/db-reset.sh"

[tasks.check]
description = "Run lint + typecheck + tests"
run = [
  "mise run backend-lint",
  "mise run backend-typecheck",
  "mise run backend-test",
  "mise run frontend-lint",
]
[tasks.dev]
description = "Run the dev stack in parallel (API, worker, frontend) -- SEM tunel publico"
depends = ["setup"]
# `:::` roda em paralelo. Uma lista em `run` seria sequencial, e como cada
# processo e long-running, o segundo nunca comecaria.
#
# O `ngrok` NAO entra aqui de proposito: o tunel encaminha a porta inteira e
# expoe a API na internet. Use `dev-tunnel` quando precisar receber webhooks.
run = "mise run backend-dev ::: backend-worker ::: frontend-dev"

[tasks.dev-tunnel]
description = "Dev stack + tunel ngrok (necessario para receber webhooks da Pluggy)"
depends = ["setup"]
# O middleware PublicTunnelRestrictionMiddleware limita o que o tunel alcanca,
# desde que DJANGO_PUBLIC_TUNNEL_HOSTS esteja setado no .env.
run = "mise run backend-dev ::: backend-worker ::: frontend-dev ::: ngrok"

